<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>決策智慧 2026 · The New Distance</title>
  <meta name="description" content="《2026 決策智慧》影像版——鉛筆與程式碼之間，品牌與人的真實距離。四支短片帶你走過序章與 People、Model、A.I 三章，最後是一張能打開 22 篇觀點的光點地圖。" />
  <meta name="theme-color" content="#030405" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23030405'/%3E%3Ccircle cx='9' cy='16' r='3' fill='%23C5D96B'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23F2A9A7'/%3E%3Ccircle cx='23' cy='16' r='3' fill='%236FCDE2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Great+Vibes&family=IBM+Plex+Mono:wght@300;400;500&family=Montserrat:wght@100;200;300&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700;900&family=Silkscreen&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/film.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body class="is-boot">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div id="bars" aria-hidden="true"><i></i><i></i></div>
  <div id="map" aria-label="22 篇觀點地圖"></div>
  <svg id="threads" aria-hidden="true"></svg>
  <div id="cap" aria-live="polite"></div>

  <!-- Boot -->
  <section id="boot" aria-label="封面">
    <div class="boot-in">
      <div class="boot-kicker mono">DENTSU 電通行銷傳播集團　·　DECISION INTELLIGENCE</div>
      <div class="boot-year">2026</div>
      <h1 class="boot-title foil">決策智慧</h1>
      <p class="boot-sub">Agentic Era：重塑品牌與人的真實距離<span>The New Distance.</span></p>
      <button id="enter" class="btn-enter" disabled>
        <span class="be-zh">進入</span><span class="be-en mono">ENTER</span><i aria-hidden="true"></i>
      </button>
      <div class="boot-load mono"><span id="boot-msg">LOADING FILM</span><b id="boot-pct">000</b></div>
      <div class="boot-how mono">建議開啟聲音 · 移動游標看見「AI 的眼睛」 · 按住空白鍵全畫面切換</div>
      <button id="boot-skip" class="link mono">略過影片，直接看目錄 →</button>
    </div>
  </section>

  <!-- Top bar -->
  <header id="top" aria-label="主選單">
    <button class="tb-home" data-go="hub" aria-label="回到入口"><b class="foil">決策智慧</b><span class="mono">2026</span></button>
    <nav class="tb-nav">
      <button data-go="people" style="--c: var(--people)"><i>01</i>People</button>
      <button data-go="model" style="--c: var(--model)"><i>02</i>Model</button>
      <button data-go="ai" style="--c: var(--ai)"><i>03</i>A.I</button>
      <button data-go="explore" class="tb-explore"><i>✦</i>探索</button>
    </nav>
    <div class="tb-tools">
      <button id="btn-index" class="mono" aria-label="目錄">目錄</button>
      <button id="btn-sound" class="mono" aria-pressed="true" aria-label="聲音">SOUND <b>ON</b></button>
    </div>
  </header>

  <!-- Film controls -->
  <div id="filmbar" aria-hidden="true">
    <div class="fb-track"><i id="fb-prog"></i></div>
    <button id="btn-skip" class="mono">略過 SKIP ›</button>
  </div>

  <!-- Hub: three doors under the three lights -->
  <section id="hub" aria-label="三個章節">
    <div class="hub-head">
      <div class="hub-k mono">CHOOSE A CHAPTER · 選一個章節</div>
      <p class="hub-q">AI 越會算，<br />品牌越要懂人。</p>
    </div>
    <div class="hub-doors"></div>
    <div class="hub-foot">
      <button class="hub-intro" data-section="intro"><i class="mono">00</i>序章 · 2 篇<span>AI for Growth ／ Agentic 時代</span></button>
      <button class="hub-explore" data-go="explore"><i>✦</i>探索全部 22 篇<span>Explore the map</span></button>
    </div>
  </section>

  <!-- Section rest: after a section film -->
  <section id="rail" aria-label="章節文章">
    <div class="rail-head"></div>
    <div class="rail-cards" role="list"></div>
    <div class="rail-nav"></div>
  </section>

  <!-- Explore scene chrome -->
  <section id="explore" aria-label="探索">
    <div class="ex-head">
      <div class="ex-k mono">EXPLORE · 22 篇觀點地圖</div>
      <p class="ex-t">指紋、向日葵、方塊頭像——<br />點亮任何一個光點，打開一篇。</p>
    </div>
    <div class="ex-themes" role="toolbar" aria-label="主題線索"></div>
    <div class="ex-tip" id="ex-tip" aria-hidden="true"></div>
  </section>

  <!-- Reader -->
  <aside id="reader" aria-label="文章" aria-hidden="true">
    <button class="rd-close" aria-label="關閉">×</button>
    <div class="rd-scroll"><article class="rd-body"></article></div>
  </aside>

  <!-- Index -->
  <section id="index" aria-label="目錄" aria-hidden="true">
    <button class="ix-close" aria-label="關閉">×</button>
    <div class="ix-scroll"><div class="ix-body"></div></div>
  </section>

  <!-- Page viewer -->
  <div id="page" aria-hidden="true">
    <button class="pg-close" aria-label="關閉">×</button>
    <button class="pg-prev" aria-label="上一頁">‹</button>
    <img alt="" />
    <button class="pg-next" aria-label="下一頁">›</button>
    <div class="pg-no mono"></div>
  </div>

  <noscript><p style="color:#eee;padding:2rem">這個網站需要 JavaScript。</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
